<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiet Zone · QR code generator</title>
    <meta
      name="description"
      content="Make QR codes for links, text, email, phone numbers and Wi-Fi. Style them, check they scan, and download PNG or SVG. Runs in your browser."
    />
    <link rel="canonical" href="https://qr-code-generator-designer.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qr-code-generator-designer.vercel.app/" />
    <meta property="og:image" content="https://qr-code-generator-designer.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Quiet Zone: a QR code on a sheet of paper with crop marks, next to the app name."
    />
    <meta property="og:title" content="Quiet Zone · QR code generator" />
    <meta
      property="og:description"
      content="Make QR codes for links, text, email, phone and Wi-Fi. Style them, then check they actually scan."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('quietzone:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Quiet Zone needs JavaScript to draw QR codes.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
